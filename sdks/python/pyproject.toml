[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refreeg-python"
version = "0.1.0"
description = "Python SDK for the RefreeG crowdfunding API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]

[tool.setuptools.packages.find]
where = ["."]